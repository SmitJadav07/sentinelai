services:
  - type: web
    name: sentinelai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HEDERA_ACCOUNT_ID
        sync: false
      - key: HEDERA_EVM_ADDRESS
        sync: false
      - key: HEDERA_TOPIC_ID
        sync: false
      - key: HEDERA_SERVICE_URL
        sync: false
      - key: CIRCLE_WALLET_ID
        sync: false
      - key: DEMO_DESTINATION_ADDRESS
        sync: false
      - key: LOOP_ENABLED
        value: "true"
      - key: LOOP_INTERVAL
        value: "300"
    healthCheckPath: /health
